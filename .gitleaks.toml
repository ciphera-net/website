# gitleaks config for the `security` workflow's secret scan. Keeps all default rules; allowlists paths
# where fake credentials live by design — test files and fixtures across every language in the estate
# (Go / TS / JS / PHP / Rust). Everywhere else a detected secret fails the `security` check
# (--exit-code 1, gating since 02-11-2026). Triage 08-10/09-10-2026 and 02-11-2026.
# ⚠️ A real secret committed INSIDE a test/fixture path would not be caught — accepted for v1.
title = "ciphera gitleaks"

[extend]
useDefault = true

[[allowlists]]
description = "Test & fixture paths carry fake credentials by design (all languages)"
paths = [
  '''.*_test\.go$''',
  '''.*\.(test|spec)\.(ts|tsx|js|jsx|mjs|cjs)$''',
  '''(^|/)__tests__/''',
  '''(^|/)__mocks__/''',
  '''(^|/)tests?/''',
  '''(^|/)[Tt]ests?/''',
  '''.*Test\.php$''',
  '''(^|/)testdata/''',
  '''(^|/)fixtures?/''',
  '''(^|/)dataimporttest/''',
  '''.*\.stories\.(ts|tsx|js|jsx)$''',
]

# Triage 02-11-2026 (gating switched on): the one pre-existing finding on main is not a secret.
# Exact value only, no `paths`: in `dir` mode gitleaks v8.30.1 skips every file whose path matches
# a global allowlist path BEFORE detection, ignoring `condition = "AND"` (sources/common.go,
# shouldSkipPath), so a path here would exempt the whole file. Any other value in it is caught.
[[allowlists]]
description = "scripts/indexnow.sh: the IndexNow key, public by design (served at https://ciphera.net/<key>.txt for the ownership check)"
regexes = ['''^7e3edc16b58611cf3c414e73669fb2b9$''']
