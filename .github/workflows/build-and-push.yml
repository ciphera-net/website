name: Build and push to Ciphera registry

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  REGISTRY: registry.ops.ciphera.net
  IMAGE_NAME: ciphera-net/ciphera-frontend

jobs:
  build-push-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Write .npmrc for GitHub Packages auth
        run: |
          {
            echo "@ciphera-net:registry=https://npm.pkg.github.com/"
            echo "//npm.pkg.github.com/:_authToken=${{ secrets.GH_PACKAGES_READ_TOKEN }}"
            echo "legacy-peer-deps=true"
          } > /tmp/npmrc

      - name: Log in to Ciphera registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.CIPHERA_REGISTRY_USER }}
          password: ${{ secrets.CIPHERA_REGISTRY_PASSWORD }}

      - name: Extract metadata for tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache,mode=max
          secret-files: |
            npmrc=/tmp/npmrc

      - name: Trigger Dokploy redeploy
        if: github.ref == 'refs/heads/main'
        run: |
          curl -fsS -X POST \
            -H "x-api-key: ${{ secrets.DOKPLOY_PUBLIC_OPS_API_KEY }}" \
            -H "Content-Type: application/json" \
            -d "{\"applicationId\":\"${{ secrets.DOKPLOY_CIPHERA_FRONTEND_APP_ID }}\"}" \
            https://public.ops.ciphera.net/api/application.deploy
