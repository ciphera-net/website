name: Build and push to Ciphera registry

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  REGISTRY: registry.ops.ciphera.net
  IMAGE_NAME: ciphera-net/ciphera-frontend

jobs:
  build-push-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Ciphera registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.CIPHERA_REGISTRY_USER }}
          password: ${{ secrets.CIPHERA_REGISTRY_PASSWORD }}

      - name: Extract metadata for tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Install Teleport
        uses: teleport-actions/setup@v1
        with:
          version: "18.7.2"
          proxy: teleport.ciphera.net:443

      - name: Teleport tunnel to Vault
        id: vault-tunnel
        uses: teleport-actions/application-tunnel@v1
        with:
          proxy: teleport.ciphera.net:443
          token: ci-deploy
          app: vault
          listen: "tcp://127.0.0.1:8200"

      - name: Read build config from Vault
        id: vault-config
        run: |
          VAULT_ADDR=http://127.0.0.1:8200
          TOKEN=$(curl -sf -X POST "${VAULT_ADDR}/v1/auth/approle/login" \
            -d "{\"role_id\":\"${{ secrets.VAULT_CI_ROLE_ID }}\",\"secret_id\":\"${{ secrets.VAULT_CI_SECRET_ID }}\"}" \
            | jq -r '.auth.client_token')
          CONFIG=$(curl -sf -H "X-Vault-Token: ${TOKEN}" \
            "${VAULT_ADDR}/v1/kv/data/ciphera-frontend/config" \
            | jq -r '.data.data')
          NPM_TOKEN=$(curl -sf -H "X-Vault-Token: ${TOKEN}" \
            "${VAULT_ADDR}/v1/kv/data/shared/github-npm-token" \
            | jq -r '.data.data.value')
          {
            echo "NEXT_PUBLIC_CAPTCHA_API_URL=$(echo "$CONFIG" | jq -r '.next_public_captcha_api_url')"
            echo "NEXT_PUBLIC_PULSE_SCRIPT_URL=$(echo "$CONFIG" | jq -r '.next_public_pulse_script_url')"
            echo "NEXT_PUBLIC_PULSE_API_URL=$(echo "$CONFIG" | jq -r '.next_public_pulse_api_url')"
            echo "NEXT_PUBLIC_WEBSITE_API_URL=$(echo "$CONFIG" | jq -r '.next_public_website_api_url')"
            echo "NEXT_PUBLIC_CDN_URL=$(echo "$CONFIG" | jq -r '.next_public_cdn_url')"
            echo "NPM_AUTH_TOKEN=${NPM_TOKEN}"
          } >> "$GITHUB_OUTPUT"

      - name: Write .npmrc from Vault token
        run: |
          {
            echo "@ciphera-net:registry=https://npm.pkg.github.com/"
            echo "//npm.pkg.github.com/:_authToken=${{ steps.vault-config.outputs.NPM_AUTH_TOKEN }}"
            echo "legacy-peer-deps=true"
          } > /tmp/npmrc

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache,mode=max
          secret-files: |
            npmrc=/tmp/npmrc
          build-args: |
            NEXT_PUBLIC_CAPTCHA_API_URL=${{ steps.vault-config.outputs.NEXT_PUBLIC_CAPTCHA_API_URL }}
            NEXT_PUBLIC_PULSE_SCRIPT_URL=${{ steps.vault-config.outputs.NEXT_PUBLIC_PULSE_SCRIPT_URL }}
            NEXT_PUBLIC_PULSE_API_URL=${{ steps.vault-config.outputs.NEXT_PUBLIC_PULSE_API_URL }}
            NEXT_PUBLIC_WEBSITE_API_URL=${{ steps.vault-config.outputs.NEXT_PUBLIC_WEBSITE_API_URL }}
            NEXT_PUBLIC_CDN_URL=${{ steps.vault-config.outputs.NEXT_PUBLIC_CDN_URL }}

      - name: Stop Vault tunnel
        if: github.ref == 'refs/heads/main'
        run: |
          kill ${{ steps.vault-tunnel.outputs.tbot-pid }} 2>/dev/null || true
          sleep 1

      - name: Teleport tunnel to Dokploy
        if: github.ref == 'refs/heads/main'
        id: tunnel
        uses: teleport-actions/application-tunnel@v1
        with:
          proxy: teleport.ciphera.net:443
          token: ci-deploy
          app: dokploy-public
          listen: "tcp://127.0.0.1:9090"

      - name: Trigger Dokploy redeploy
        if: github.ref == 'refs/heads/main'
        run: |
          sleep 3
          curl -fsS -X POST \
            -H "x-api-key: ${{ secrets.DOKPLOY_PUBLIC_OPS_API_KEY }}" \
            -H "Content-Type: application/json" \
            -d "{\"applicationId\":\"${{ secrets.DOKPLOY_CIPHERA_FRONTEND_APP_ID }}\"}" \
            http://localhost:9090/api/application.deploy

      - name: Annotate deployment in Grafana
        if: github.ref == 'refs/heads/main' && success()
        continue-on-error: true
        run: |
          curl -fsS -X POST \
            "http://10.10.0.40:3000/api/annotations" \
            -H "Authorization: Bearer ${{ secrets.GRAFANA_API_KEY }}" \
            -H "Content-Type: application/json" \
            -d '{"text":"Deploy: website ${{ github.sha }}","tags":["deployment","website"]}'
