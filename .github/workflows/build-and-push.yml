name: Build and push to Ciphera registry

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  REGISTRY: registry.ops.ciphera.net
  IMAGE_NAME: ciphera-net/ciphera-frontend

jobs:
  build-push-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Write .npmrc for GitHub Packages auth
        run: |
          {
            echo "@ciphera-net:registry=https://npm.pkg.github.com/"
            echo "//npm.pkg.github.com/:_authToken=${{ secrets.GH_PACKAGES_READ_TOKEN }}"
            echo "legacy-peer-deps=true"
          } > /tmp/npmrc

      - name: Log in to Ciphera registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.CIPHERA_REGISTRY_USER }}
          password: ${{ secrets.CIPHERA_REGISTRY_PASSWORD }}

      - name: Extract metadata for tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache,mode=max
          secret-files: |
            npmrc=/tmp/npmrc
          # NEXT_PUBLIC_* values are inlined into the client JS bundle at build time.
          # They MUST be passed here — Dokploy runtime env vars don't affect the client.
          # These are public URLs (they end up in the browser either way), so hardcoding
          # them in the workflow is safe and keeps config in one place.
          build-args: |
            NEXT_PUBLIC_CAPTCHA_API_URL=https://captcha.ciphera.net/api/v1
            NEXT_PUBLIC_PULSE_SCRIPT_URL=https://pulse.ciphera.net/script.js
            NEXT_PUBLIC_PULSE_API_URL=https://pulse-api.ciphera.net
            NEXT_PUBLIC_WEBSITE_API_URL=https://api.ciphera.net
            NEXT_PUBLIC_CDN_URL=https://cdn.ciphera.net/website

      - name: Install Teleport
        if: github.ref == 'refs/heads/main'
        uses: teleport-actions/setup@v1
        with:
          version: "18.7.2"
          proxy: teleport.ciphera.net:443

      - name: Teleport tunnel to Dokploy
        if: github.ref == 'refs/heads/main'
        id: tunnel
        uses: teleport-actions/application-tunnel@v1
        with:
          proxy: teleport.ciphera.net:443
          token: ci-deploy
          app: dokploy-public
          listen: "tcp://127.0.0.1:9090"

      - name: Trigger Dokploy redeploy
        if: github.ref == 'refs/heads/main'
        run: |
          curl -fsS -X POST \
            -H "x-api-key: ${{ secrets.DOKPLOY_PUBLIC_OPS_API_KEY }}" \
            -H "Content-Type: application/json" \
            -d "{\"applicationId\":\"${{ secrets.DOKPLOY_CIPHERA_FRONTEND_APP_ID }}\"}" \
            http://localhost:9090/api/application.deploy

      - name: Annotate deployment in Grafana
        if: github.ref == 'refs/heads/main' && success()
        continue-on-error: true
        run: |
          curl -fsS -X POST \
            "http://10.10.0.40:3000/api/annotations" \
            -H "Authorization: Bearer ${{ secrets.GRAFANA_API_KEY }}" \
            -H "Content-Type: application/json" \
            -d '{"text":"Deploy: website ${{ github.sha }}","tags":["deployment","website"]}'
