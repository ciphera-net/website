depends_on:
  - push

when:
  - event: push
    branch: main

steps:
  deploy:
    image: alpine:3.20
    volumes:
      - /opt/woodpecker/secrets/nomad-token:/run/ci/nomad-token:ro
      - /opt/vault-agent/tls/ca.pem:/run/ci/nomad-ca.pem:ro
    environment:
      REGISTRY_USERNAME:
        from_secret: registry_username
      REGISTRY_PASSWORD:
        from_secret: registry_password
    commands:
      - apk add --no-cache curl jq >/dev/null
      - export NOMAD_TOKEN=$(cat /run/ci/nomad-token)
      - export DEPLOY_SHA=${CI_COMMIT_SHA:0:7}
      - |
        DIGEST=$(curl -sfI -u "$REGISTRY_USERNAME:$REGISTRY_PASSWORD" \
          -H "Accept: application/vnd.oci.image.index.v1+json, application/vnd.docker.distribution.manifest.list.v2+json, application/vnd.docker.distribution.manifest.v2+json" \
          "https://registry.ops.ciphera.net/v2/ciphera-net/ciphera-frontend/manifests/sha-$DEPLOY_SHA" \
          | tr -d '\r' | awk 'tolower($1)=="docker-content-digest:"{print $2}')
        test -n "$DIGEST"
      - |
        curl -sf --cacert /run/ci/nomad-ca.pem -H "X-Nomad-Token: $NOMAD_TOKEN" \
          https://10.10.0.110:4646/v1/job/ciphera-website | jq \
          ".Meta.deploy_sha = \"$DEPLOY_SHA\" |
           .TaskGroups[0].Tasks[0].Config.image = \"registry.ops.ciphera.net/ciphera-net/ciphera-frontend@$DIGEST\" |
           .TaskGroups[0].Tasks[0].Config.force_pull = true" > /tmp/job.json
      - |
        curl -fsS --cacert /run/ci/nomad-ca.pem -X POST -H "X-Nomad-Token: $NOMAD_TOKEN" \
          -H "Content-Type: application/json" \
          -d "{\"Job\": $(cat /tmp/job.json)}" \
          https://10.10.0.110:4646/v1/jobs
      - echo "Deployed ciphera-website ($DEPLOY_SHA)"

  # After the rollout converges, purge the immutable /_next/static assets from the
  # Bunny edge. Chunk hashes change per build; during the rollout window the edge can
  # cache a 404 for a new-build chunk (pulled from the still-old alloc) and serve it
  # for 30 days — blanking the site. Waiting for the deployment to be healthy first
  # guarantees the edge re-populates from the NEW allocation.
  purge-cdn:
    image: alpine:3.20
    volumes:
      - /opt/woodpecker/secrets/nomad-token:/run/ci/nomad-token:ro
      - /opt/vault-agent/tls/ca.pem:/run/ci/nomad-ca.pem:ro
    environment:
      BUNNY_API_KEY:
        from_secret: bunny_api_key
    commands:
      - apk add --no-cache curl jq >/dev/null
      - export NOMAD_TOKEN=$(cat /run/ci/nomad-token)
      - |
        for i in $(seq 1 60); do
          S=$(curl -sf --cacert /run/ci/nomad-ca.pem -H "X-Nomad-Token: $NOMAD_TOKEN" \
            https://10.10.0.110:4646/v1/job/ciphera-website/deployment | jq -r '.Status // "none"')
          echo "deployment: $S"
          [ "$S" = "successful" ] && break
          case "$S" in failed|cancelled) echo "deploy not healthy ($S)"; exit 1 ;; esac
          sleep 5
        done
      - |
        curl -fsS -X POST \
          "https://api.bunny.net/purge?url=https://ciphera.net/_next/static/*&async=false" \
          -H "AccessKey: $BUNNY_API_KEY"
      - echo "Purged ciphera.net /_next/static/*"
