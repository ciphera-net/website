# MEASURED SHELL SEMANTICS this file depends on (verified 25-07-2026 in alpine:3.20
# /bin/sh, i.e. BusyBox ash, which is what Woodpecker actually runs):
#   - `cmd && { ... }` does NOT trip errexit when cmd is false. Safe.
#   - a BARE `S=$(failing-cmd)` DOES abort the step (rc=1). Never assign an API read
#     that way without an `|| { ...; }` arm.
#   - `export S=$(failing-cmd)` does NOT abort (export is a builtin and the list takes
#     the builtin's status) — so it SILENTLY yields an empty value. Every cross-step
#     handoff is therefore validated explicitly below.
#   - a `for` loop that ends without breaking exits 0 — every wait loop needs an
#     explicit final-iteration arm or it silently falls through to the next command.
#
# WHY THE SECRETS ARE MOUNTED AS A DIRECTORY, NOT AS FILES:
#   woodpecker-agent's token-sync publishes atomically (write .tmp, then `mv`). A
#   rename swaps the inode, and a single-FILE bind mount is pinned to the inode that
#   existed at container creation — so a file mount can never observe a refreshed
#   token. Mounting the directory is what makes re-reading work (same reason
#   Kubernetes' atomic writer projects directories).
#   /opt/vault-agent/tls is mounted at a SEPARATE path rather than nested inside
#   /run/ci, because Docker cannot create a nested mountpoint inside a :ro mount.

# Routes this workflow to the in-cluster Kubernetes agent, which advertises
# `!runner=k8s` — a MANDATORY label, so the agent is only eligible when a task
# asks for it. Deleting this line sends the workflow back to the ci-ops Docker
# agent; that is the rollback, and it is one line.
labels:
  runner: k8s

# 🔑 skip_clone (21-08-2026). NOT ONE STEP IN THIS WORKFLOW READS THE REPOSITORY.
# Every step touches only /woodpecker/digest, /woodpecker/deploy_sha,
# /tmp/mc-invariants.json and the pod's own ServiceAccount token.
# Cloning to run curl and jq cost ~19s per pipeline across nine deploy workflows;
# measured 20-08-2026 and deferred into this migration because it touches the same
# files. If a step ever DOES start reading a repo file it fails loudly and
# immediately on a missing path, not silently on stale content.
# See Infra/docs/audits/20-08-2026-ci-latency-audit.md §5.5 and §16 item 8.
skip_clone: true

depends_on:
  - push
  - test

when:
  - event: push
    branch: main

steps:
  # Resolve the immutable digest ONCE, then ship BY DIGEST. Until 17-08-2026 this
  # fed two targets (the cluster and Bunny) so they could not drift; the cluster
  # half is retired and Magic Containers is now the only one. Resolving the digest
  # separately is still what lets bunny-push assert that MC converged on exactly
  # the image this pipeline built, rather than on whatever `:sha-xxx` points at.
  # ⚠️ The Accept list MUST include application/vnd.oci.image.manifest.v1+json.
  # kaniko INHERITS THE BASE IMAGE'S manifest media type, so the format varies
  # per REPO, not per tool. With an incomplete Accept the registry can fall back
  # to legacy schema1 and return a DIFFERENT DIGEST for the same tag — measured
  # 27-07-2026 — which would pin a Deployment to something that is not the image
  # that was built, with every gate still green.
  digest:
    image: registry.ops.ciphera.net/ciphera-net/ci-deploy:v1
    pull: true
    # Resources declared 29-07-2026 — without them the step pod is QoS BestEffort, first
    # evicted under node memory pressure. Estate-wide sweep after two pulse-backend steps
    # were SIGKILLed (exit 137) mid-download, presenting as a test failure (see
    # pulse-backend #147/#148). Sized by step class.
    backend_options:
      kubernetes:
        resources:
          requests: { memory: 128Mi, cpu: 100m }
          limits: { memory: 512Mi }
    # registry.ops.ciphera.net resolves to the cluster's own NLB. A pod dialling
    # its own cluster's public load balancer hits the Exoscale NLB hairpin, and
    # ~1/node_count of those connections are black-holed. Pin the name at
    # Traefik's ClusterIP so the request never leaves the cluster.
    extra_hosts:
      - "registry.ops.ciphera.net:10.101.182.27"
    environment:
      REGISTRY_USERNAME:
        from_secret: registry_username
      REGISTRY_PASSWORD:
        from_secret: registry_password
    commands:
      - export DEPLOY_SHA=${CI_COMMIT_SHA:0:7}
      - |
        DIGEST=$(curl -sfI --max-time 60 -u "$REGISTRY_USERNAME:$REGISTRY_PASSWORD" \
          -H "Accept: application/vnd.oci.image.index.v1+json, application/vnd.docker.distribution.manifest.list.v2+json, application/vnd.docker.distribution.manifest.v2+json, application/vnd.oci.image.manifest.v1+json" \
          "https://registry.ops.ciphera.net/v2/ciphera-net/ciphera-frontend/manifests/sha-$DEPLOY_SHA" \
          | tr -d '\r' | awk 'tolower($1)=="docker-content-digest:"{print $2}')
        case "$DIGEST" in
          sha256:*) ;;
          *) echo "digest resolution failed for sha-$DEPLOY_SHA (got [$DIGEST]) — did push finish?"; exit 1 ;;
        esac
        # /woodpecker is the per-workflow shared volume (verified live: the step
        # container has wp_<pipeline>_<workflow>_default mounted there rw), so every
        # step of THIS workflow sees these two files.
        echo "$DIGEST"     > /woodpecker/digest
        echo "$DEPLOY_SHA" > /woodpecker/deploy_sha
      - echo "resolved sha-$DEPLOY_SHA -> $(cat /woodpecker/digest)"

  # ═══ THE MAGIC CONTAINERS DEPLOY PATH ═══
  # 🔴 SINCE 16-08-2026 THE CLUSTER IS NOT THE ORIGIN. ciphera.net is pull zone
  # 5440429, whose OriginUrl is https://mc-ghu9zkqynq.bunny.run — the Magic
  # Containers app (id in the `mc_app_id` secret). This step is what makes a merge
  # to main reach production.
  #
  # 🔴 THIS IS THE ONLY DEPLOY PATH. There is no `deploy-k8s` step any more and no
  # in-cluster copy of this site — Deployment, Service, Ingress, PDB, SA and
  # NetworkPolicy were all deleted 17-08-2026, one day after the cutover, along
  # with the `website-sks-tls` certificate (owned by that Ingress).
  #
  # ⚠️ SO A FAILURE HERE IS NOT ABSORBED BY ANYTHING. It leaves Magic Containers
  # on the PREVIOUS image, serving a stale ciphera.net, until someone re-runs this
  # pipeline. `McImageBehindMain` is what notices, after 30 minutes.
  #
  # ⛔ ROLLING BACK IS NO LONGER AN API CALL. Between 16-08 and 17-08 the cluster
  # copy was deliberately kept so the zone's OriginUrl could be flipped back — it
  # was used, once, when the first cutover attempt 508'd. That option is gone:
  # website-sks.ciphera.net now answers nothing. Restoring it is a rebuild from
  # Infra/Kubernetes/workloads/_shared/snapshots/17-08-2026-ciphera-website-retirement/
  # (that restore HAS been rehearsed — see the snapshot README).
  #
  # ⚠️ THE OPS IMAGE REPO IS `ciphera-net/ciphera-frontend`, NOT `ciphera-net/website`.
  # The name predates the repo rename and matches neither the Git repo nor the
  # Deployment. The Bunny-side repo is named `website` to match this repo, the MC
  # app and the mc-deploy-check table — so the legacy name stops here.
  #
  # ⚠️ Bunny publishes no scoped registry token; the documented registry login is
  # the account API key. Nothing below may put it in argv, echo it, or write it
  # anywhere that outlives this step.
  bunny-push:
    image: registry.ops.ciphera.net/ciphera-net/ci-deploy:v1
    pull: true
    depends_on: [digest]
    backend_options:
      kubernetes:
        resources:
          # This step no longer streams an image through the pod (the copy into
          # registry.bunny.net was removed 02-11-2026); it makes a handful of API
          # calls. Sized down to match, but NOT left unset: BestEffort is first
          # evicted under node memory pressure, and an eviction here presents as a
          # Bunny API error rather than as what it is.
          requests: { memory: 128Mi, cpu: 100m }
          limits: { memory: 512Mi }
    environment:
      # Account and app identifiers come from Woodpecker secrets, not literals.
      # They are not credentials — nothing here is exploitable without
      # `bunny_api_key` — but 🔴 THIS REPO IS PUBLIC, and a literal would tell a
      # reader exactly which account to attack and which secret is worth taking.
      #   bunny_account  org-level  (shared with every repo that talks to Bunny)
      #   mc_app_id      repo-level (one MC app per repo)
      MC_APP_ID:
        from_secret: mc_app_id
      # The MC app's own hostname — the ORIGIN of ciphera.net, not the public
      # name. It is what goes down if the endpoint is lost, which is why it is
      # the name printed in the failure message.
      MC_HOSTNAME: mc-ghu9zkqynq.bunny.run
      # Rebuilt into the PATCH body in the WRITE shape. A Next.js standalone
      # server has no separate health endpoint, so `/` on the app port is the
      # probe. PROBE_PORT must match the PORT env var on the MC app (3001), which
      # in turn matches the in-cluster Deployment — the image's own default is
      # 3000 and both origins override it.
      PROBE_PATH: /
      PROBE_PORT: "3001"
      BUNNY_API_KEY:
        from_secret: bunny_api_key
    commands:
      - |
        DIGEST=$(cat /woodpecker/digest) || { echo "digest handoff missing"; exit 1; }
        DEPLOY_SHA=$(cat /woodpecker/deploy_sha) || { echo "deploy_sha handoff missing"; exit 1; }
        case "$DIGEST" in sha256:*) ;; *) echo "bad digest handoff [$DIGEST]"; exit 1 ;; esac
        [ -n "$DEPLOY_SHA" ] || { echo "empty deploy_sha handoff"; exit 1; }
        export DIGEST DEPLOY_SHA
        echo "TAG=sha-$DEPLOY_SHA  DIGEST=$DIGEST"
      # 🔁 THE COPY INTO registry.bunny.net IS GONE (02-11-2026). Magic Containers
      # pulls this image straight from registry.ops.ciphera.net — MC registry object
      # 12602, via the GET/HEAD-only host registry-origin.ciphera.net — so copying it
      # into Bunny's registry fed nothing. What made that possible is
      # `oci-mediatypes=false` in push.yml: MC's puller sends an Accept header listing
      # only the Docker manifest types, and registry.bunny.net had been hiding that by
      # serving OCI to a client that never asked for it. Audit §78.26–§78.27.
      #
      # 🔴 The PATCH below passes the app's EXISTING imageRegistryId through, so this
      # pipeline can no longer put the image anywhere else if that id ever changes.
      # The assertion below is what makes that loud rather than silent: a deploy
      # against the wrong registry would otherwise set a tag that is not there and
      # leave production on the old image behind a green pipeline.
      # ═══ RECORD WHAT WE ARE NOT SENDING, BEFORE WE SEND ═══
      # The PATCH replaces the template, so the only way to prove it did not
      # silently drop something is to know what was there first.
      #   endpoints[].id + pullZoneId — losing these is DESTRUCTIVE, not merely
      #     wrong: the pull zone goes with the endpoint, and here that zone is the
      #     ORIGIN of ciphera.net.
      #   packageId — the container SIZE, and 🔴 the patch body DOES NOT SEND IT.
      #     It is omitted because this body is the shape proven in production on
      #     sigil and help, and adding an unproven field to a REPLACE is the larger
      #     risk. Whether Bunny preserves an omitted packageId is UNVERIFIED, so it
      #     is asserted instead of assumed.
      - |
        # 🔑 STATUS CAPTURED, NOT SWALLOWED (21-08-2026). This exact call failed
        # twice today during Bunny-side incidents and `curl -sf` reported no
        # reason — "could not read MC app" with nothing to act on. -f collapses
        # every HTTP error into rc=22; capturing the code names the failure.
        HTTP=$(curl -s --max-time 20 -o /tmp/mc-before.json -w '%{http_code}' \
              -H "AccessKey: $BUNNY_API_KEY" \
              "https://api.bunny.net/mc/apps/$MC_APP_ID") \
          || { echo "FAIL: GET /mc/apps/$MC_APP_ID — curl transport error rc=$?"; exit 1; }
        [ "$HTTP" = "200" ] \
          || { echo "FAIL: GET /mc/apps/$MC_APP_ID -> HTTP $HTTP"; head -c 300 /tmp/mc-before.json; echo; exit 1; }
        jq -c '{packageId: .containerTemplates[0].packageId,
                endpoints: ([.containerTemplates[0].endpoints[] | {id, pullZoneId}] | sort_by(.id))}' \
          /tmp/mc-before.json > /tmp/mc-invariants.json
        echo "invariants before: $(cat /tmp/mc-invariants.json)"
        [ "$(jq '.endpoints | length' /tmp/mc-invariants.json)" -ge 1 ] \
          || { echo "FAIL: MC app already has no endpoints — refusing to touch it"; exit 1; }
        # 🔴 The image now comes from registry.ops.ciphera.net ONLY — nothing copies it
        # anywhere else any more. This pipeline passes the app's existing
        # imageRegistryId through unchanged, so if that id is ever not ours, the PATCH
        # would point production at a registry this tag was never pushed to: MC keeps
        # serving the old image and every gate here stays green. Fail loudly instead.
        # 12602 = "Ciphera registry (pull-only)". ⚠️ The v3 API returns it as a STRING.
        MCREG=$(jq -r '.containerTemplates[0].imageRegistryId' /tmp/mc-before.json)
        [ "$MCREG" = "12602" ] \
          || { echo "FAIL: MC app is on image registry [$MCREG], expected 12602 (ours)."; \
               echo "Nothing copies images to another registry any more — see the note above."; exit 1; }
      # ═══ 🔴🔴 THE PATCH BODY IS LOAD-BEARING AND A NAIVE ONE IS DESTRUCTIVE ═══
      # PATCH /mc/apps/{id} REPLACES containerTemplates — it does not merge. A body
      # of {name, imageTag} returns 200 and wipes environmentVariables, probes AND
      # endpoints; destroying the endpoint DELETES ITS PULL ZONE and takes the
      # hostname down. That is exactly how icons.ciphera.net went down on 13-08-2026.
      # ⚠️ For this app `environmentVariables` carries PORT=3001 and NODE_OPTIONS
      # --max-old-space-size=200. Losing PORT alone is enough to break it: the
      # image's own default is 3000, so the server would listen on a port the
      # endpoint does not map and every request would fail. That does not fail the
      # PATCH — it ships a broken container, which is worse than a 500.
      # Three properties make it an update instead of a replace:
      #   * the FULL template (registry/namespace/name/tag/pullPolicy, env, probes,
      #     endpoints) — a partial body is destructive, not rejected;
      #   * endpoints in the WRITE shape (cdn:{portMappings}), NOT the READ shape
      #     the GET returns (type/publicHost/pullZoneId);
      #   * each endpoint's EXISTING `id`. Without it Bunny creates a new pull zone
      #     and destroys the old one — and ciphera.net's OriginUrl would then point
      #     at a zone that no longer exists.
      - |
        jq --arg tag "sha-$DEPLOY_SHA" --arg pp "$PROBE_PATH" --argjson pn "$PROBE_PORT" '
          .containerTemplates[0] as $t
          | {containerTemplates: [{
              id: $t.id, name: $t.name,
              imageRegistryId: $t.imageRegistryId,
              imageNamespace:  $t.imageNamespace,
              imageName:       $t.imageName,
              imageTag:        $tag,
              imagePullPolicy: "Always",
              environmentVariables: $t.environmentVariables,
              probes: {
                liveness:  {httpGet:{request:{path:$pp,portNumber:$pn}}},
                readiness: {httpGet:{request:{path:$pp,portNumber:$pn}}}
              },
              endpoints: [ $t.endpoints[] | {
                id: .id, displayName: .displayName,
                cdn: {portMappings: [ .portMappings[] | {containerPort: .containerPort, port: 80} ]}
              }]
            }]}' /tmp/mc-before.json > /tmp/mc-patch.json \
          || { echo "FAIL: building patch body"; exit 1; }
        # Belt and braces against the exact 13-08 failure: never send a body that
        # would drop the endpoint, whatever produced it.
        EPC=$(jq '.containerTemplates[0].endpoints | length' /tmp/mc-patch.json)
        [ "$EPC" -ge 1 ] || { echo "FAIL: patch body has no endpoints, refusing to send"; exit 1; }
        NOID=$(jq '[.containerTemplates[0].endpoints[] | select(.id == null)] | length' /tmp/mc-patch.json)
        [ "$NOID" = "0" ] \
          || { echo "FAIL: $NOID endpoint(s) in the patch body have no id — sending this would MINT A NEW PULL ZONE and destroy $MC_HOSTNAME"; exit 1; }
        # The env block is not decoration for this app — PORT=3001 is load-bearing.
        # Assert both that it survived the rebuild and that PORT is still in it.
        ENVC=$(jq '.containerTemplates[0].environmentVariables | length' /tmp/mc-patch.json)
        [ "$ENVC" -ge 1 ] || { echo "FAIL: patch body has no environmentVariables, refusing to send"; exit 1; }
        PORTV=$(jq -r '[.containerTemplates[0].environmentVariables[] | select(.name=="PORT") | .value] | first // ""' /tmp/mc-patch.json)
        [ "$PORTV" = "$PROBE_PORT" ] \
          || { echo "FAIL: PORT in the patch body is [$PORTV], expected $PROBE_PORT — sending this ships a server listening on a port the endpoint does not map"; exit 1; }
        echo "patch body: $EPC endpoint(s) all with ids, $ENVC env var(s) incl PORT=$PORTV, tag sha-$DEPLOY_SHA"
      - |
        # 🔑 Same status-capture as the GET above — the 21-08 Bunny incidents made
        # this exact line fail with no diagnosis. A PATCH that is refused must
        # say HOW it was refused, or the on-call is debugging blind.
        HTTP=$(curl -s --max-time 30 -o /tmp/mc-patch-resp -w '%{http_code}' \
          -X PATCH -H "AccessKey: $BUNNY_API_KEY" \
          -H 'Content-Type: application/json' -d @/tmp/mc-patch.json \
          "https://api.bunny.net/mc/apps/$MC_APP_ID") \
          || { echo "FAIL: PATCH /mc/apps/$MC_APP_ID — curl transport error rc=$?"; exit 1; }
        case "$HTTP" in
          2*) echo "PATCH accepted (HTTP $HTTP)" ;;
          *) echo "FAIL: PATCH /mc/apps/$MC_APP_ID -> HTTP $HTTP"; head -c 400 /tmp/mc-patch-resp; echo; exit 1 ;;
        esac
      # ═══ 🔴 RE-GET. A 2xx IS NOT PROOF ═══
      # This API silently discards fields it does not like, so success is defined
      # as BOTH: the digest we shipped is live, AND everything we did NOT send is
      # still there — same endpoint ids, same pull zone, same package. Checking
      # imageDigest alone would report green on the change that took a hostname
      # down on 13-08. Polled rather than slept: MC accepts the PATCH and reflects
      # the new digest asynchronously, so a fixed sleep is either flaky or wasteful.
      - |
        OK=no; A_DIG=""; A_INV=""
        WANT=$(cat /tmp/mc-invariants.json)
        for i in $(seq 1 20); do
          A=$(curl -sf --max-time 20 -H "AccessKey: $BUNNY_API_KEY" \
              "https://api.bunny.net/mc/apps/$MC_APP_ID") \
            || { echo "re-read failed (iter $i) — retrying"; sleep 5; continue; }
          A_DIG=$(echo "$A" | jq -r '.containerTemplates[0].imageDigest')
          A_INV=$(echo "$A" | jq -c '{packageId: .containerTemplates[0].packageId,
                                      endpoints: ([.containerTemplates[0].endpoints[] | {id, pullZoneId}] | sort_by(.id))}')
          if [ "$A_DIG" = "$DIGEST" ] && [ "$A_INV" = "$WANT" ]; then
            OK=yes; echo "MC now runs $A_DIG; invariants intact: $A_INV"; break
          fi
          sleep 5
        done
        if [ "$OK" != "yes" ]; then
          echo "--- expected digest: $DIGEST"
          echo "--- actual digest:   $A_DIG"
          echo "--- invariants before: $WANT"
          echo "--- invariants after:  $A_INV"
          if [ "$A_INV" != "$WANT" ]; then
            echo "🔴 THE PATCH CHANGED SOMETHING IT DID NOT SEND."
            echo "🔴 If endpoints or pullZoneId moved, $MC_HOSTNAME is GONE — and it is the ONLY ORIGIN"
            echo "🔴 of ciphera.net (pull zone 5440429). THE SITE IS DOWN, not degraded."
            echo "🔴 There is no in-cluster fallback since 17-08-2026: website-sks.ciphera.net answers"
            echo "🔴 nothing, so repointing the zone at it makes things worse, not better."
            echo "🔴 Rebuild the endpoint per Infra/MagicContainers/website/README.md -> 'Teardown /"
            echo "🔴 rebuilding the endpoint', then set the zone's OriginUrl AND OriginHostHeader to the"
            echo "🔴 NEW mc-*.bunny.run host — both, or the edge 404s on a Host it does not own."
          fi
          echo "FAIL: MC did not converge on the shipped image with its configuration intact"
          exit 1
        fi
      # A rollout across 42 regions is PROGRESSIVE — roughly 10 minutes, measured
      # 15-08-2026. This step returning green means MC is CONFIGURED to run the new
      # image, not that every region already serves it. See purge-cdn below.
      - echo "Magic Containers app $MC_APP_ID set to sha-$DEPLOY_SHA ($MC_HOSTNAME) — rollout across 42 regions takes ~10 min"
  # GREEN MEANS LIVE (since 07-11-2026). bunny-push ends as soon as the app's TEMPLATE holds the new digest, which
  # the API shows within seconds; the regions then replace their instances over 2.5 to 20 minutes, and a rollout one
  # region cannot start is put back by Bunny after about 25 minutes with no error anywhere (docs, 21-10-2026). So a
  # green pipeline meant "configured", not "serving". This step waits until the app reads `active` on the shipped
  # tag and digest and every ready container in /overview runs that digest, polling every 15 s for at most 20
  # minutes. A template moved off the shipped tag is a revert and fails at once.
  wait-live:
    image: registry.ops.ciphera.net/ciphera-net/ci-deploy:v1
    pull: true
    depends_on: [bunny-push]
    backend_options:
      kubernetes:
        resources:
          requests: { memory: 128Mi, cpu: 100m }
          limits: { memory: 512Mi }
    environment:
      MC_APP_ID:
        from_secret: mc_app_id
      BUNNY_API_KEY:
        from_secret: bunny_api_key
    commands:
      - |
        LIMIT=1200
        DIGEST=$(cat /woodpecker/digest) || { echo "digest handoff missing"; exit 1; }
        TAG="sha-$(cat /woodpecker/deploy_sha)" || { echo "deploy_sha handoff missing"; exit 1; }
        case "$DIGEST" in sha256:*) ;; *) echo "bad digest handoff [$DIGEST]"; exit 1 ;; esac
        START=$(date +%s); LAST=""
        while :; do
          T=$(( $(date +%s) - START ))
          A=$(curl -s --max-time 20 -o /tmp/mc-app.json -w '%{http_code}' -H "AccessKey: $BUNNY_API_KEY" \
                "https://api.bunny.net/mc/apps/$MC_APP_ID") || A="curl rc=$?"
          O=$(curl -s --max-time 30 -o /tmp/mc-overview.json -w '%{http_code}' -H "AccessKey: $BUNNY_API_KEY" \
                "https://api.bunny.net/mc/apps/$MC_APP_ID/overview") || O="curl rc=$?"
          if [ "$A" = 200 ] && [ "$O" = 200 ]; then
            NOWTAG=$(jq -r '.containerTemplates[0].imageTag' /tmp/mc-app.json)
            if [ "$NOWTAG" != "$TAG" ]; then
              echo "FAIL: the app's template now names $NOWTAG, not $TAG. Bunny put the previous release back (a region could"
              echo "not start the new one: read GET /mc/apps/<id>/logs), or a newer deploy replaced this one."
              exit 1
            fi
            ST=$(jq -r --arg d "$DIGEST" '"\(.status) digest-match=\(.containerTemplates[0].imageDigest == $d)"' /tmp/mc-app.json)
            RD=$(jq -r '[.regions[].pods[].containers[] | select(.status == "ready") | .image | sub(".*@sha256:"; "") | .[0:12]]
                        | group_by(.) | map("\(.[0]) x\(length)") | join(", ")' /tmp/mc-overview.json)
            LIVE=$(jq -r --arg d "$DIGEST" '[.regions[].pods[].containers[] | select(.status == "ready") | .image
                        | endswith("@" + $d)] | (length > 0 and all)' /tmp/mc-overview.json)
            LINE="$ST | ready containers by digest: $RD"
            [ "$LINE" != "$LAST" ] && { echo "+$((T))s $LINE"; LAST=$LINE; }
            if [ "$ST" = "active digest-match=true" ] && [ "$LIVE" = true ]; then
              echo "LIVE after $((T))s: the app is active on $TAG and every ready container runs $DIGEST"
              break
            fi
          else
            echo "+$((T))s API read failed (app: $A, overview: $O), retrying"
          fi
          if [ "$T" -ge "$LIMIT" ]; then
            echo "FAIL: not live after $((LIMIT / 60)) minutes. Regions not yet on $DIGEST:"
            jq -r --arg d "$DIGEST" '.regions[] | select(any(.pods[].containers[]; .status != "ready" or (.image | endswith("@" + $d) | not)))
                   | "  \(.region): \([.pods[].containers[] | "\(.status) \(.image | sub(".*@sha256:"; "") | .[0:12])"] | join(", "))"' \
              /tmp/mc-overview.json
            echo "Bunny reverts a rollout it cannot finish after about 25 minutes. Read GET /mc/apps/<id>/logs for"
            echo "\"Failed to pull image\" or CreatePodSandboxError lines from those regions."
            exit 1
          fi
          sleep 15
        done


  # ⚠️ THIS PURGE NARROWS THE WINDOW; IT DOES NOT CLOSE IT.
  #
  # It was written when the CLUSTER was the origin, and it was EXACT then: it hung
  # off `deploy-k8s`, which asserted that only the new ReplicaSet was serving, so a
  # purge after it could only ever re-cache the new build. BOTH halves of that
  # precondition are now gone — the origin became Magic Containers on 16-08-2026
  # and the step that provided the guarantee was deleted on 17-08. An MC rollout is
  # PROGRESSIVE (~10 min for 42 regions), so there is no instant at which "the
  # origin serves the new build" is true everywhere, and a purge fired here can
  # still re-cache the old build at some PoPs. Measured on help 15-08-2026: a purge
  # fired immediately after the MC PATCH did not stick.
  #
  # It is kept, chained behind bunny-push, because that is at least ordered against
  # the real origin — it cannot fire before MC has been told about the new image.
  # What actually makes the new build visible everywhere is the 300s HTML TTL on
  # zone 5440429 once the rollout converges, so a deploy is live within ~15-20 min.
  #
  # 🔵 OPEN QUESTION, deliberately not decided here: whether this step earns its
  # keep at all. Making it correct means polling MC for convergence before purging.
  # Deleting it costs nothing measurable. The identical question is open on `help`
  # (15-08 open item 3.2) — decide both together, not one at a time.
  #
  # 🔵 It is NOT necessary to purge the inner MC pull zone. That zone carries one
  # edge rule overriding cache time to 0 for everything except /_next/static/*, so
  # it holds no HTML at all, and the chunks it does hold are content-hashed —
  # a new build has new paths and cannot collide with the old ones.
  purge-cdn:
    image: registry.ops.ciphera.net/ciphera-net/ci-deploy:v1
    pull: true
    backend_options:
      kubernetes:
        resources:
          requests: { memory: 128Mi, cpu: 100m }
          limits: { memory: 512Mi }
    depends_on: [wait-live]
    environment:
      BUNNY_API_KEY:
        from_secret: bunny_api_key
    commands:
      # Retry the purge rather than failing a deploy that already shipped on both
      # targets; wildcard purges are the rate-limited kind. If it still fails, say
      # precisely what to do, because the instinctive "re-run the deploy" would roll
      # production again just to retry one HTTP POST.
      # Since 31-07-2026 the edge also caches marketing HTML (Bunny edge rule
      # "Cache marketing HTML", Override Cache Time on the section prefixes below).
      # Purging only /_next/static/* would leave the previous build's HTML at the
      # edge pointing at chunk hashes this same deploy just evicted — the blanking
      # failure, reached from the other side. These HTML patterns MUST stay in step
      # with that rule's allowlist.
      # Deliberately NOT a single https://ciphera.net/* wildcard: that also matches
      # the image/font objects carrying a 30-day TTL, which nothing purges today,
      # and evicting them would be a miss stampede against a single-replica origin.
      # /feed.xml, /sitemap.xml and /sys/* are absent on purpose — they are not
      # cached, so they must not be purged either. Same for /contact, /press and
      # /sustainability: a Bunny edge rule allows at most 5 conditions of 5 patterns
      # (25 total), the static exclusions already use 3 conditions, so the HTML
      # allowlist is capped at 10 patterns and those three sections stay uncached.
      - |
        for TARGET in \
          "https://ciphera.net/_next/static/*" \
          "https://ciphera.net/" \
          "https://ciphera.net/blog*" "https://ciphera.net/learn*" \
          "https://ciphera.net/glossary*" "https://ciphera.net/products*" \
          "https://ciphera.net/about*" "https://ciphera.net/trust*" \
          "https://ciphera.net/what-is-ciphera*" \
          "https://ciphera.net/privacy*" "https://ciphera.net/terms*" ; do
          curl -fsS --max-time 300 --retry 3 --retry-delay 10 --retry-all-errors -X POST \
            "https://api.bunny.net/purge?url=$TARGET&async=false" \
            -H "AccessKey: $BUNNY_API_KEY" \
            || { echo "DEPLOY SHIPPED; CDN PURGE FAILED for $TARGET — re-run the purge only, do NOT re-deploy"; exit 1; }
          echo "Purged $TARGET"
        done
      # VERIFY (since 07-11-2026). wait-live proved every region serves the new build before the purge above, so a
      # page the edge fetched after the purge is the new build. Each page must answer 200 and be a MISS or a copy
      # cached after the purge; an older copy means the purge did not take on this edge (one edge node ignored
      # purges for days in October), so it is purged again and re-read, every 15 s, for up to five minutes.
      - |
        PURGED=$(date -u +%s)
        for URL in https://ciphera.net/ https://ciphera.net/privacy https://ciphera.net/terms https://ciphera.net/about; do
          ok=no
          for i in $(seq 1 20); do
            CODE=$(curl -s -o /dev/null -D /tmp/h -w '%{http_code}' --max-time 30 "$URL") || CODE=000
            CACHE=$(grep -i '^cdn-cache:' /tmp/h | tr -d '\r' | awk '{print toupper($2)}')
            AT=$(grep -i '^cdn-cachedat:' /tmp/h | tr -d '\r' | cut -d' ' -f2-)
            ATS=0
            [ -n "$AT" ] && ATS=$(date -u -D '%m/%d/%Y %H:%M:%S' -d "$AT" +%s 2>/dev/null || echo 0)
            if [ "$CODE" = 200 ] && { [ "$CACHE" = MISS ] || [ "$ATS" -ge "$PURGED" ]; }; then
              echo "verified $URL: HTTP $CODE, cdn-cache $CACHE, cached at [$AT]"
              ok=yes
              break
            fi
            echo "$URL: HTTP $CODE, cdn-cache $CACHE, cached at [$AT], before the purge ended ($(date -u -d @"$PURGED" +%H:%M:%S)): purging it again"
            curl -fsS --max-time 60 -X POST "https://api.bunny.net/purge?url=$URL&async=false" \
              -H "AccessKey: $BUNNY_API_KEY" >/dev/null || echo "re-purge of $URL failed; re-reading anyway"
            sleep 15
          done
          [ "$ok" = yes ] || { echo "FAIL: $URL still serves a copy cached before the purge, after five minutes"; exit 1; }
        done
