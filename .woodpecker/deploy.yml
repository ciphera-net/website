when:
  - event: push
    branch: main

steps:
  write-npmrc:
    image: alpine:3.20
    environment:
      NPM_TOKEN:
        from_secret: npm_token
    commands:
      - printf '@ciphera-net:registry=https://npm.pkg.github.com/\n//npm.pkg.github.com/:_authToken=%s\nlegacy-peer-deps=true\n' "$NPM_TOKEN" > .npmrc-ci

  build-push:
    image: woodpeckerci/plugin-docker-buildx:6.1.1
    privileged: true
    settings:
      registry: registry.ops.ciphera.net
      repo: registry.ops.ciphera.net/ciphera-net/ciphera-frontend
      # SHADOW MODE: distinct tag namespace; GitHub Actions remains the sole deployer.
      # cache_to intentionally omitted: do not overwrite the buildcache GH Actions relies on.
      tags: ["shadow-${CI_COMMIT_SHA:0:7}"]
      username:
        from_secret: registry_username
      password:
        from_secret: registry_password
      # Literal commas in list-valued settings (cache_from, secrets) must be
      # escaped as \\, per the plugin docs, or items get split apart.
      cache_from:
        - type=registry\\,ref=registry.ops.ciphera.net/ciphera-net/ciphera-frontend:buildcache
      # Each item is passed verbatim to `docker buildx build --secret`;
      # the Dockerfile mounts it via --mount=type=secret,id=npmrc.
      secrets:
        - id=npmrc\\,src=.npmrc-ci
      build_args:
        NEXT_PUBLIC_CAPTCHA_API_URL:
          from_secret: next_public_captcha_api_url
        NEXT_PUBLIC_PULSE_SCRIPT_URL:
          from_secret: next_public_pulse_script_url
        NEXT_PUBLIC_PULSE_API_URL:
          from_secret: next_public_pulse_api_url
        NEXT_PUBLIC_WEBSITE_API_URL:
          from_secret: next_public_website_api_url
        NEXT_PUBLIC_CDN_URL:
          from_secret: next_public_cdn_url
